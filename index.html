<script>
let allData=[];
let filteredData=[];
let selectedRowId=null;
const tbody=document.getElementById('body');
const searchInput=document.getElementById('search');
const statusDiv=document.getElementById('status');

/* ===== DATA FETCH FROM GITHUB (3 FILES) ===== */
async function fullLoad() {
    statusDiv.innerText = 'Loading data from GitHub...';
    try {
        // 3no files ko ek sath fetch kar rahe hain
        let [dataRes, vendorRes, orderRes] = await Promise.all([
            fetch('data.json?cache=' + new Date().getTime()).then(r => r.json()),
            fetch('vendors.json?cache=' + new Date().getTime()).then(r => r.json()),
            fetch('order.json?cache=' + new Date().getTime()).then(r => r.json())
        ]);
        
        let itemMap = new Map();
        for (let item of dataRes) itemMap.set(item.bc, item);
        
        allData = [];
        let placedBcs = new Set();
        
        // Pehle order.json ke hisaab se rows set karenge
        for (let bc of orderRes) {
            if (bc.startsWith("VENDOR_")) {
                let vendor = vendorRes.find(v => v.bc === bc);
                if (vendor) {
                    allData.push({bc: vendor.bc, nm: vendor.nm, inv:0, sale:0, dmd:0, days:999, rate:0, tp:0});
                    placedBcs.add(bc);
                }
            } else {
                if (itemMap.has(bc)) {
                    allData.push(itemMap.get(bc));
                    placedBcs.add(bc);
                }
            }
        }
        
        // Jo items order mein nahi hain unko end par add karenge
        for (let item of dataRes) if (!placedBcs.has(item.bc)) allData.push(item);
        for (let vendor of vendorRes) if (!placedBcs.has(vendor.bc)) allData.push({bc: vendor.bc, nm: vendor.nm, inv:0, sale:0, dmd:0, days:999, rate:0, tp:0});
        
        // SEARCH FILTER HATA DIA HAI TAAKE TYPE KARNE PAR LIST CHOTI NA HO
        filteredData = [...allData]; 
        displayRows();
        statusDiv.innerText = 'Last Synced: ' + new Date().toLocaleTimeString();
    } catch(e) {
        statusDiv.innerText = 'Error: ' + e.message + '. Wait for server to sync.';
    }
}

/* ===== SEARCH LOGIC ===== */
function handleSearchKey(event){
    if(event.key==='Enter'){
        event.preventDefault();
        performSearchJump(); // Sirf Enter dabane par hi focus hoga
    } else if(event.key==='Escape'){
        searchInput.value='';
        selectedRowId=null;
        // doSearch() ki jagah direct displayRows() ko call karenge
        filteredData = [...allData];
        displayRows();
        statusDiv.innerText='Search cleared';
    }
    // Type karne par kuch nahi hoga (doSearch remove kar diya gaya hai)
}

function performSearchJump(){
    let query=searchInput.value.trim().toLowerCase();
    if(!query)return;
    let startIdx=0;
    if(selectedRowId){
        let cur=filteredData.findIndex(i=>i.bc===selectedRowId);
        if(cur!==-1)startIdx=cur+1;
    }
    for(let i=startIdx;i<filteredData.length;i++){
        let it=filteredData[i];
        if(!it.bc.startsWith('VENDOR_')&&(it.nm.toLowerCase().includes(query)||it.bc.includes(query))){
            selectAndScrollToTop(i);
            return;
        }
    }
    for(let i=0;i<startIdx;i++){
        let it=filteredData[i];
        if(!it.bc.startsWith('VENDOR_')&&(it.nm.toLowerCase().includes(query)||it.bc.includes(query))){
            selectAndScrollToTop(i);
            return;
        }
    }
    statusDiv.innerText='No match found for: '+query;
}

function selectAndScrollToTop(viewIdx){
    let item=filteredData[viewIdx];
    selectedRowId=item.bc;
    displayRows();
    setTimeout(()=>{
        let row=tbody.querySelector(`tr[data-row-id='${item.bc}']`);
        if(row){
            let sc=document.getElementById('tableSection');
            let th=document.querySelector('thead');
            let thH=th?th.offsetHeight:40;
            let rR=row.getBoundingClientRect();
            let cR=sc.getBoundingClientRect();
            sc.scrollTo({top:(rR.top-cR.top)+sc.scrollTop-thH-5,behavior:'smooth'});
        }
    },50);
    statusDiv.innerText='Match found at row '+(viewIdx+1);
}

/* ===== DISPLAY ROWS WITH VENDORS ===== */
// doSearch function ko hata diya hai kyunki ab humein type karne par filter nahi karna

function displayRows(){
    let h='';
    for(let i=0;i<filteredData.length;i++){
        let r=filteredData[i];
        let s=(selectedRowId===r.bc)?' row-selected':'';
        
        if(r.bc.startsWith('VENDOR_')){
            h+=`<tr class='c-vendor-row' data-row-id='${r.bc}'>`+
               `<td></td><td class='c-vendor-name'>${r.nm}</td><td></td><td></td><td></td><td></td><td></td><td></td>`+
               `</tr>`;
            continue;
        }
        
        let dC = parseFloat(r.dmd) < 0 ? 'c-dmd-neg' : 'c-dmd-pos';
        let dyC = (parseFloat(r.days) <= 15 && parseFloat(r.days) != 999) ? 'c-days-alert' : 'c-days-ok';
        
        h+=`<tr class='${s}' data-row-id='${r.bc}'>`+
        `<td class='c-barcode'>${r.bc}</td>`+
        `<td class='c-name'>${r.nm}</td>`+
        `<td class='c-inv'>${r.inv}</td>`+
        `<td class='c-sale'>${r.sale}</td>`+
        `<td class='${dC}'>${r.dmd}</td>`+
        `<td class='${dyC}'>${r.days}</td>`+
        `<td class='c-default'>${r.rate}</td>`+
        `<td class='c-default'>${r.tp}</td>`+
        `</tr>`;
    }
    if(filteredData.length === 0){
        h = '<tr><td colspan="8" style="text-align:center;">No data found</td></tr>';
    }
    tbody.innerHTML=h;
}

/* ===== INITIALIZATION ===== */
fullLoad();
setInterval(fullLoad, 120000); // Har 2 minute baad data update hoga
</script>
